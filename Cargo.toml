[package]
name = "tessera-webview"
version = "0.1.0"
edition = "2024"
description = "Native WebView components and platform services for Tessera"
license = "MIT OR Apache-2.0"
exclude = ["android/build", "android/.gradle", "android/local.properties"]

[dependencies]
async-channel = "2.5"
futures-channel = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tessera-foundation = { git = "https://github.com/tessera-ui/tessera.git", rev = "125f882717fdd92215f005e34e1cb6904fef2dda" }
tessera-ui = { git = "https://github.com/tessera-ui/tessera.git", rev = "125f882717fdd92215f005e34e1cb6904fef2dda" }
tokio = { version = "1.48", features = ["time"] }
url = "2.5"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
wry = "0.57.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSError", "NSJSONSerialization", "NSString", "NSURL", "NSURLRequest"] }
objc2-ui-kit = { version = "0.3", features = ["UIColor", "UIResponder", "UIView"] }
objc2-web-kit = { version = "0.3", features = ["WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKUserScript", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
